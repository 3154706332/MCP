name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:    # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a]   # 可扩展: armeabi-v7a, x86, x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platforms
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sdkmanager "ndk;29.0.14206865"

      - name: Check for prebuilt native libraries
        run: |
          # 尝试从 GitHub Release 下载预编译的 Rizin SDK（如果有）
          if [ -n "${{ secrets.RIZIN_SDK_URL }}" ]; then
            curl -L "${{ secrets.RIZIN_SDK_URL }}" -o rizin-sdk.tar.gz
            tar xzf rizin-sdk.tar.gz -C "${{ github.workspace }}"
          else
            echo "No Rizin SDK — native Rizin backends will use stubs"
          fi

      - name: Build debug APK (${{ matrix.abi }})
        run: |
          ./gradlew :app:assembleDebug \
            -Pandroid.injected.invoked.from.ide=false \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOMCP-debug-${{ matrix.abi }}
          path: app/build/outputs/apk/debug/app-${{ matrix.abi }}-debug.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SOMCP-debug-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
          generate_release_notes: true